name: Build Kernel And GRUB

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 可选 Release 标签；留空只上传 Actions artifact。已有 Release 只替换 grub.img.7z 和对应校验值。
        required: false
        default: ""
        type: string
      output_prefix:
        description: Actions artifact 和中间文件名前缀。
        required: true
        default: y700-kernel-test
        type: string
      kernel_source_ref:
        description: 要编译的内核 commit、tag 或 branch；建议使用固定 commit。
        required: true
        default: 5df8e852ea722929f5359a5ef28ebcec0c4443fd
        type: string
      kernel_build_jobs:
        description: 内核并行编译任务数。
        required: true
        default: "4"
        type: string
      kernel_config_fragment:
        description: 仓库内的 Kconfig fragment；修改该文件即可调整内核配置，留空则不应用。
        required: false
        default: configs/y700-kernel.config.fragment
        type: string
      boot_image_size:
        description: GRUB/FAT 镜像大小；verified template 默认使用 256M。
        required: true
        default: 256M
        type: string
      boot_config:
        description: 可选高级 GRUB 覆盖配置，按 KEY=value 每行填写。
        required: false
        default: ""
        type: string
      source_config:
        description: 可选高级内核源码/基础配置覆盖，按 KEY=value 每行填写。
        required: false
        default: ""
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install kernel and GRUB dependencies
        run: |
          set -euo pipefail
          source scripts/ci/common.sh
          packages=(
            bc bison flex make git curl ca-certificates tar unzip xz-utils zstd p7zip-full
            gcc-aarch64-linux-gnu libssl-dev libelf-dev dwarves device-tree-compiler ccache
            dosfstools mtools
          )
          ci_retry 4 10 sudo apt-get update
          ci_retry 4 10 sudo apt-get install -y "${packages[@]}"

      - name: Apply kernel-only workflow configuration
        env:
          INPUT_OUTPUT_PREFIX: ${{ inputs.output_prefix }}
          INPUT_KERNEL_SOURCE_REF: ${{ inputs.kernel_source_ref }}
          INPUT_KERNEL_BUILD_JOBS: ${{ inputs.kernel_build_jobs }}
          INPUT_KERNEL_CONFIG_FRAGMENT: ${{ inputs.kernel_config_fragment }}
          INPUT_BOOT_IMAGE_SIZE: ${{ inputs.boot_image_size }}
          INPUT_BOOT_CONFIG: ${{ inputs.boot_config }}
          INPUT_SOURCE_CONFIG: ${{ inputs.source_config }}
        run: |
          set -euo pipefail
          case "$INPUT_OUTPUT_PREFIX" in
            ''|*[!A-Za-z0-9._-]*)
              echo 'output_prefix may contain only letters, numbers, dot, underscore, and dash.' >&2
              exit 1
              ;;
          esac
          cat > "$RUNNER_TEMP/kernel-source.env" <<'CONFIG_EOF'
          KERNEL_SOURCE_REPOSITORY=https://github.com/GUF296/linux.git
          KERNEL_BASE_CONFIG_ARCHIVE=
          KERNEL_ARTIFACT_ARCHIVE=https://github.com/GUF296/ubuntu-y700-build-ci/releases/download/bootstrap-y700-20260625/y700-kernel-artifacts-7.1.1-g5df8e852ea72.tar.gz
          KERNEL_CCACHE_MAXSIZE=4G
          DTB_NAME=sm8650-lenovo-tb321fu.dtb
          CONFIG_EOF
          cat > "$RUNNER_TEMP/kernel-boot.env" <<'CONFIG_EOF'
          BOOT_TEMPLATE_IMAGE=https://github.com/GUF296/ubuntu-y700-build-ci/releases/download/bootstrap-y700-20260625/y700-verified-grub-template-userdata-20260624-201420.img
          BOOT_FAT_BITS=32
          BOOT_FAT_LABEL=Y700GRUB
          BOOT_SECTOR_SIZE=512
          BOOT_CLUSTER_SECTORS=
          ROOT_SELECTOR=partlabel
          ROOT_PARTLABEL=userdata
          ROOT_UUID=
          ROOTARGS=
          ROOTARGS_EXTRA=
          STABLEARGS=drm_client_lib.active=none
          BOOT_COMPRESS=7z
          BOOT_CHUNK_SIZE=
          KEEP_BOOT_IMAGE=0
          CONFIG_EOF
          sed -i 's/^          //' "$RUNNER_TEMP/kernel-source.env" "$RUNNER_TEMP/kernel-boot.env"
          if [ -n "$INPUT_SOURCE_CONFIG" ]; then
            printf '\n%s\n' "$INPUT_SOURCE_CONFIG" >> "$RUNNER_TEMP/kernel-source.env"
          fi
          if [ -n "$INPUT_BOOT_CONFIG" ]; then
            printf '\n%s\n' "$INPUT_BOOT_CONFIG" >> "$RUNNER_TEMP/kernel-boot.env"
          fi
          {
            printf 'KERNEL_SOURCE_REF=%s\n' "$INPUT_KERNEL_SOURCE_REF"
            printf 'KERNEL_BUILD_JOBS=%s\n' "$INPUT_KERNEL_BUILD_JOBS"
            printf 'KERNEL_CONFIG_FRAGMENT=%s\n' "$INPUT_KERNEL_CONFIG_FRAGMENT"
          } >> "$RUNNER_TEMP/kernel-source.env"
          printf 'BOOT_IMAGE_SIZE=%s\n' "$INPUT_BOOT_IMAGE_SIZE" >> "$RUNNER_TEMP/kernel-boot.env"

          scripts/ci/apply-workflow-config.sh "$RUNNER_TEMP/kernel-source.env"
          scripts/ci/apply-workflow-config.sh "$RUNNER_TEMP/kernel-boot.env"
          {
            echo 'OUTPUT_DIR_KERNEL=out/y700-kernel-artifacts'
            echo 'OUTPUT_DIR_GRUB=out/ci-grub'
            echo 'OUTPUT_DIR_RELEASE=out/kernel-grub-release'
            echo "KERNEL_CCACHE_DIR=$RUNNER_TEMP/y700-kernel-ccache"
            echo 'OUTPUT_PREFIX<<EOF_OUTPUT_PREFIX'
            printf '%s\n' "$INPUT_OUTPUT_PREFIX"
            echo 'EOF_OUTPUT_PREFIX'
          } >> "$GITHUB_ENV"

      - name: Validate output and calculate cache identities
        id: cache-meta
        run: |
          set -euo pipefail
          [ "$BOOT_COMPRESS" = 7z ] || {
            echo 'This workflow always produces grub.img.7z; BOOT_COMPRESS must remain 7z.' >&2
            exit 1
          }
          [ -z "${BOOT_CHUNK_SIZE:-}" ] || {
            echo 'This workflow requires one grub.img.7z file; BOOT_CHUNK_SIZE must remain empty.' >&2
            exit 1
          }

          fragment_hash=none
          if [ -n "${KERNEL_CONFIG_FRAGMENT:-}" ]; then
            [ -f "$KERNEL_CONFIG_FRAGMENT" ] || {
              echo "Missing kernel config fragment: $KERNEL_CONFIG_FRAGMENT" >&2
              exit 1
            }
            fragment_hash=$(sha256sum "$KERNEL_CONFIG_FRAGMENT" | cut -d' ' -f1)
          fi
          compiler_version=$(aarch64-linux-gnu-gcc -dumpfullversion -dumpversion)
          base_config_input=${KERNEL_BASE_CONFIG_ARCHIVE:-$KERNEL_ARTIFACT_ARCHIVE}
          base_config_identity=$base_config_input
          if [ -f "$base_config_input" ]; then
            base_config_identity=$(sha256sum "$base_config_input" | cut -d' ' -f1)
          fi
          ref_cache_nonce=fixed
          if ! printf '%s\n' "$KERNEL_SOURCE_REF" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            # Branches and tags can move. Never restore a completed kernel artifact
            # from an older run unless the input is an immutable full commit ID.
            ref_cache_nonce=$GITHUB_RUN_ID
          fi
          base_identity=$(printf '%s\0' \
            "$KERNEL_SOURCE_REPOSITORY" "$KERNEL_SOURCE_REF" \
            "$base_config_identity" \
            "$DTB_NAME" "$compiler_version" \
            | sha256sum | cut -d' ' -f1)
          build_identity=$(printf '%s\0' \
            "$fragment_hash" "$KERNEL_BUILD_JOBS" "$ref_cache_nonce" \
            "$(sha256sum scripts/ci/build-y700-kernel-artifacts.sh | cut -d' ' -f1)" \
            "$(sha256sum scripts/ci/common.sh | cut -d' ' -f1)" \
            | sha256sum | cut -d' ' -f1)
          echo "base=$base_identity" >> "$GITHUB_OUTPUT"
          echo "build=$build_identity" >> "$GITHUB_OUTPUT"

      - name: Restore exact kernel artifact
        id: kernel-artifact-cache
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: out/y700-kernel-artifacts
          key: y700-kernel-artifact-${{ runner.arch }}-${{ steps.cache-meta.outputs.base }}-${{ steps.cache-meta.outputs.build }}

      - name: Restore compiler cache
        if: steps.kernel-artifact-cache.outputs.cache-hit != 'true'
        id: kernel-ccache-restore
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/y700-kernel-ccache
          key: y700-kernel-ccache-${{ runner.arch }}-${{ steps.cache-meta.outputs.base }}-${{ steps.cache-meta.outputs.build }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            y700-kernel-ccache-${{ runner.arch }}-${{ steps.cache-meta.outputs.base }}-${{ steps.cache-meta.outputs.build }}-
            y700-kernel-ccache-${{ runner.arch }}-${{ steps.cache-meta.outputs.base }}-

      - name: Build kernel Image and DTB
        id: build-kernel
        if: steps.kernel-artifact-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          env \
            OUTPUT_DIR="$OUTPUT_DIR_KERNEL" \
            KERNEL_SOURCE_REPOSITORY="$KERNEL_SOURCE_REPOSITORY" \
            KERNEL_SOURCE_REF="$KERNEL_SOURCE_REF" \
            KERNEL_BUILD_JOBS="$KERNEL_BUILD_JOBS" \
            KERNEL_BASE_CONFIG_ARCHIVE="${KERNEL_BASE_CONFIG_ARCHIVE:-$KERNEL_ARTIFACT_ARCHIVE}" \
            KERNEL_CONFIG_FRAGMENT="${KERNEL_CONFIG_FRAGMENT:-}" \
            KERNEL_CCACHE_DIR="$KERNEL_CCACHE_DIR" \
            KERNEL_CCACHE_MAXSIZE="$KERNEL_CCACHE_MAXSIZE" \
            DTB_NAME="$DTB_NAME" \
            bash scripts/ci/build-y700-kernel-artifacts.sh

      - name: Save exact kernel artifact
        if: steps.build-kernel.outcome == 'success' && steps.kernel-artifact-cache.outcome == 'success' && steps.kernel-artifact-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: out/y700-kernel-artifacts
          key: ${{ steps.kernel-artifact-cache.outputs.cache-primary-key }}

      - name: Save compiler cache
        if: steps.build-kernel.outcome == 'success' && steps.kernel-ccache-restore.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/y700-kernel-ccache
          key: ${{ steps.kernel-ccache-restore.outputs.cache-primary-key }}

      - name: Select kernel artifact
        run: |
          set -euo pipefail
          kernel_archive=$(find "$OUTPUT_DIR_KERNEL" -maxdepth 1 -type f -name 'y700-kernel-artifacts-*-snap.tar.gz' -print -quit)
          [ -n "$kernel_archive" ]
          echo "Y700_KERNEL_ARTIFACT_ARCHIVE=$kernel_archive" >> "$GITHUB_ENV"

      - name: Build GRUB boot image
        run: |
          set -euo pipefail
          env \
            OUTPUT_DIR="$OUTPUT_DIR_GRUB" \
            OUTPUT_PREFIX="$OUTPUT_PREFIX" \
            BOOT_TEMPLATE_IMAGE="${BOOT_TEMPLATE_IMAGE:-}" \
            BOOT_IMAGE_SIZE="$BOOT_IMAGE_SIZE" \
            BOOT_FAT_BITS="$BOOT_FAT_BITS" \
            BOOT_FAT_LABEL="$BOOT_FAT_LABEL" \
            BOOT_SECTOR_SIZE="$BOOT_SECTOR_SIZE" \
            BOOT_CLUSTER_SECTORS="$BOOT_CLUSTER_SECTORS" \
            KERNEL_ARTIFACT_ARCHIVE="$Y700_KERNEL_ARTIFACT_ARCHIVE" \
            DTB_NAME="$DTB_NAME" \
            ROOT_SELECTOR="$ROOT_SELECTOR" \
            ROOT_PARTLABEL="$ROOT_PARTLABEL" \
            ROOT_UUID="$ROOT_UUID" \
            ROOTARGS="$ROOTARGS" \
            ROOTARGS_EXTRA="$ROOTARGS_EXTRA" \
            STABLEARGS="$STABLEARGS" \
            BOOT_COMPRESS="$BOOT_COMPRESS" \
            BOOT_CHUNK_SIZE="$BOOT_CHUNK_SIZE" \
            KEEP_BOOT_IMAGE="$KEEP_BOOT_IMAGE" \
            bash scripts/ci/build-grub-image.sh

      - name: Stage grub.img.7z
        run: |
          set -euo pipefail
          source_archive="$OUTPUT_DIR_GRUB/${OUTPUT_PREFIX}-grub-fat.img.7z"
          [ -f "$source_archive" ]
          mkdir -p "$OUTPUT_DIR_RELEASE"
          install -m 0644 "$source_archive" "$OUTPUT_DIR_RELEASE/grub.img.7z"
          install -m 0644 "$Y700_KERNEL_ARTIFACT_ARCHIVE" "$OUTPUT_DIR_RELEASE/"
          install -m 0644 \
            "$OUTPUT_DIR_KERNEL/SHA256SUMS-y700-kernel-artifacts.txt" \
            "$OUTPUT_DIR_RELEASE/"
          (cd "$OUTPUT_DIR_RELEASE" && sha256sum grub.img.7z > SHA256SUMS.txt)

      - name: Upload kernel and GRUB artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.output_prefix }}-kernel-grub
          path: out/kernel-grub-release/
          if-no-files-found: error
          compression-level: 0

      - name: Upload release assets without deleting rootfs
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/kernel-grub-release-notes.md"
          cat > "$notes" <<NOTES
          # Kernel + GRUB build

          - Kernel ref: \`$KERNEL_SOURCE_REF\`
          - Config fragment: \`${KERNEL_CONFIG_FRAGMENT:-none}\`
          - Workflow run: \`$GITHUB_RUN_ID\`

          This kernel-only build replaces only \`grub.img.7z\` and preserves any existing rootfs and boot assets.
          NOTES
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file "$notes"
          fi

          old_checksums="$RUNNER_TEMP/existing-release-checksums"
          mkdir -p "$old_checksums"
          has_checksums=$(gh release view "$RELEASE_TAG" --json assets \
            --jq 'any(.assets[]; .name == "SHA256SUMS.txt")')
          if [ "$has_checksums" = true ]; then
            gh release download "$RELEASE_TAG" \
              --pattern SHA256SUMS.txt \
              --dir "$old_checksums"
            awk '$2 != "grub.img.7z" && $2 != "./grub.img.7z" && $2 != "*grub.img.7z"' \
              "$old_checksums/SHA256SUMS.txt" > "$OUTPUT_DIR_RELEASE/SHA256SUMS.txt"
          else
            : > "$OUTPUT_DIR_RELEASE/SHA256SUMS.txt"
          fi
          (cd "$OUTPUT_DIR_RELEASE" && sha256sum grub.img.7z >> SHA256SUMS.txt)
          gh release upload "$RELEASE_TAG" \
            "$OUTPUT_DIR_RELEASE/grub.img.7z" \
            "$OUTPUT_DIR_RELEASE/SHA256SUMS.txt" \
            --clobber
